<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bloom · Allen Institute</title>
<meta name="description" content="bloom: a multimodal transformer-based model for single-cell RNA and ATAC data.">
<meta property="og:title" content="bloom">
<meta property="og:description" content="Unifying representations of brain cells across modalities and contexts.">
<link rel="icon" type="image/svg+xml" href="assets/img/bloom-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="site-header wrap">
  <a class="wordmark" href="#top"><span class="accent">b</span>loom</a>
</header>

<main id="top">

  <!-- Hero ---------------------------------------------------------------->
  <section class="hero wrap">
    <div class="hero-copy">
      <h1>Unifying representations of brain cells across modalities and contexts.</h1>
      <p class="lede">A multimodal transformer-based model for single-cell RNA and ATAC data.</p>
      <div class="actions">
        <!-- TODO: replace # with the preprint URL once it is public -->
        <a class="btn btn-solid" href="#">Read the preprint</a>
        <a class="btn btn-line" href="https://github.com/alleninstitute/bloom-preview">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/></svg>
          Code on GitHub
        </a>
      </div>
    </div>
    <div class="hero-logo">
      <img class="logo-reveal" src="assets/img/bloom-logo.svg" alt="bloom logo" width="314" height="293">
    </div>
  </section>

  <!-- Model figure: geometry lives here; timing lives in assets/js/figure.js -->
  <section class="model" id="model">
    <div class="wrap model-inner">
      <h2>From a cell to its representation</h2>

      <figure class="fig-frame">

        <!-- One figure for every screen; on phones figure.js turns the viewBox into a camera -->
        <svg class="fig" viewBox="0 22 1385 284" preserveAspectRatio="xMidYMid meet" role="img"
             aria-label="A cell's measured genes and peaks are tokenized and sampled into two overlapping views. Each view passes through an encoder of attention heads and a Perceiver into a cell representation, which feeds a reconstruction head and a VISReg alignment head.">
          <defs>
            <filter id="glow-w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
            <marker id="arrow-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#666"/></marker>
          </defs>

          <!-- section titles -->
          <g class="t-title" text-anchor="middle">
            <text x="184" y="44">Experimental measurements</text>
            <text x="528" y="44">Feature sampling</text>
            <text x="1038" y="44">Model training</text>
          </g>
          <g class="rule">
            <line x1="24" y1="56" x2="344" y2="56"/>
            <line x1="372" y1="56" x2="684" y2="56"/>
            <line x1="712" y1="56" x2="1365" y2="56"/>
          </g>

          <!-- cell + genome track -->
          <ellipse class="cell" cx="70" cy="200" rx="40" ry="34"/>
          <circle class="nucleus" cx="74" cy="203" r="14"/>
          <text class="t-note" x="70" y="252" text-anchor="middle">Cell</text>
          <line class="conn" data-draw="1" x1="110" y1="200" x2="140" y2="200"/>
          <line class="baseline" x1="140" y1="200" x2="338" y2="200"/>
          <g class="features" transform="translate(0,195)">
            <rect class="g on" x="146" width="22" height="10" rx="1"/><rect class="p" x="176" width="7" height="10" rx="1"/><rect class="g" x="191" width="22" height="10" rx="1"/>
            <rect class="p on" x="221" width="7" height="10" rx="1"/><rect class="p" x="236" width="7" height="10" rx="1"/><rect class="g on" x="251" width="22" height="10" rx="1"/>
            <rect class="p on" x="281" width="7" height="10" rx="1"/><rect class="g" x="296" width="22" height="10" rx="1"/><rect class="p on" x="326" width="7" height="10" rx="1"/>
          </g>
          <g class="vbars">
            <g class="g" data-sy="signal"><line x1="148" y1="188" x2="164" y2="188"/><line x1="151" y1="181" x2="167" y2="181"/><line x1="148" y1="174" x2="164" y2="174"/></g>
            <g class="p" data-sy="signal"><line x1="220" y1="188" x2="229" y2="188"/><line x1="223" y1="181" x2="232" y2="181"/></g>
            <g class="g" data-sy="signal"><line x1="253" y1="188" x2="269" y2="188"/><line x1="256" y1="181" x2="272" y2="181"/></g>
            <g class="p" data-sy="signal"><line x1="280" y1="188" x2="289" y2="188"/><line x1="283" y1="181" x2="292" y2="181"/><line x1="280" y1="174" x2="289" y2="174"/></g>
            <g class="p" data-sy="signal"><line x1="325" y1="188" x2="334" y2="188"/></g>
          </g>
          <g class="legend">
            <line class="g" x1="148" y1="234" x2="162" y2="234"/><text x="168" y="238">Gene</text>
            <line class="p" x1="216" y1="234" x2="226" y2="234"/><text x="232" y="238">Peak</text>
          </g>
          <line class="conn" data-draw="2" x1="338" y1="200" x2="378" y2="200"/>

          <!-- two views; tokens are added by figure.js -->
          <g data-op="views">
            <ellipse class="view view-a" cx="460" cy="200" rx="82" ry="76"/>
            <ellipse class="view view-b" cx="580" cy="200" rx="104" ry="96"/>
            <text class="t-view" x="446" y="148" text-anchor="middle">View I</text>
            <text class="t-view" x="580" y="130" text-anchor="middle">View II</text>
          </g>
          <g data-tokens></g>
          <line class="conn" data-draw="3" x1="684" y1="200" x2="712" y2="200"/>

          <!-- encoder -->
          <path class="bracket" d="M712,98 L712,92 L1060,92 L1060,98"/>
          <text class="t-bracket" x="886" y="84" text-anchor="middle">Encoder</text>

          <rect class="glow" data-glow="att" filter="url(#glow-w)" x="712" y="106" width="150" height="188" rx="6"/>
          <rect class="box" x="712" y="106" width="150" height="188" rx="6"/>
          <rect class="hl" data-glow="att" x="712" y="106" width="150" height="188" rx="6"/>
          <text class="t-box" x="787" y="130" text-anchor="middle">Attention heads</text>
          <g class="t-qkv" text-anchor="middle"><text x="728" y="171">Q</text><text x="728" y="205">K</text><text x="728" y="239">V</text></g>
          <g class="heads">
            <rect class="seq" x="749" y="156" width="12" height="20"/><rect class="pos" x="785" y="156" width="12" height="20"/><rect class="seq" x="815" y="156" width="12" height="20"/><rect class="pos" x="827" y="156" width="12" height="20"/><rect class="val" x="839" y="156" width="12" height="20"/>
            <rect class="seq" x="749" y="190" width="12" height="20"/><rect class="pos" x="785" y="190" width="12" height="20"/><rect class="seq" x="815" y="190" width="12" height="20"/><rect class="pos" x="827" y="190" width="12" height="20"/><rect class="val" x="839" y="190" width="12" height="20"/>
            <rect class="seq" x="743" y="224" width="12" height="20"/><rect class="val" x="755" y="224" width="12" height="20"/><rect class="seq" x="779" y="224" width="12" height="20"/><rect class="val" x="791" y="224" width="12" height="20"/><rect class="seq" x="815" y="224" width="12" height="20"/><rect class="pos" x="827" y="224" width="12" height="20"/><rect class="val" x="839" y="224" width="12" height="20"/>
          </g>
          <g class="t-note" text-anchor="middle"><text x="755" y="266">seq</text><text x="791" y="266">pos</text><text x="833" y="266">std</text></g>
          <line class="conn" data-draw="4" x1="862" y1="200" x2="898" y2="200"/>

          <rect class="glow" data-glow="per" filter="url(#glow-w)" x="888" y="106" width="172" height="188" rx="6"/>
          <rect class="box" x="888" y="106" width="172" height="188" rx="6"/>
          <rect class="hl" data-glow="per" x="888" y="106" width="172" height="188" rx="6"/>
          <text class="t-box" x="974" y="130" text-anchor="middle">Perceiver</text>
          <g class="latents"><rect x="899" y="143" width="11" height="11"/><rect x="913" y="143" width="11" height="11"/><rect x="927" y="143" width="11" height="11"/><rect x="941" y="143" width="11" height="11"/><rect x="955" y="143" width="11" height="11"/></g>
          <text class="t-note" x="973" y="152">Latents</text>
          <line class="arrow" marker-end="url(#arrow-w)" x1="933" y1="158" x2="933" y2="178"/>
          <text class="t-qkv" x="940" y="172">Q</text>
          <rect class="sub" x="898" y="178" width="70" height="44" rx="4"/>
          <g class="t-sub" text-anchor="middle"><text x="933" y="196">cross</text><text x="933" y="212">attention</text></g>
          <line class="conn" data-draw="5" x1="968" y1="200" x2="982" y2="200"/>
          <rect class="sub" x="982" y="178" width="70" height="44" rx="4"/>
          <g class="t-sub" text-anchor="middle"><text x="1017" y="196">self</text><text x="1017" y="212">attention</text></g>
          <text class="t-label" x="1052" y="238" text-anchor="end">×N</text>
          <line class="conn" data-draw="6" x1="1060" y1="200" x2="1107" y2="200"/>

          <!-- cell representation (one slot, view I then view II) -->
          <circle class="emb" data-op="embA" cx="1115" cy="200" r="8"/>
          <circle class="emb dashed" data-op="embB" cx="1115" cy="200" r="8"/>
          <text class="t-note" font-size="12" x="1115" y="228" text-anchor="middle"><tspan x="1115">Cell</tspan><tspan x="1115" dy="14">representation</tspan></text>
          <path class="conn" data-draw="7" d="M1123,200 L1163,200 M1163,149 L1163,251"/>
          <line class="conn" data-draw="7" x1="1163" y1="149" x2="1185" y2="149"/>
          <line class="conn" data-draw="7" x1="1163" y1="251" x2="1185" y2="251"/>

          <!-- task heads -->
          <path class="bracket" d="M1185,98 L1185,92 L1365,92 L1365,98"/>
          <text class="t-bracket" x="1275" y="84" text-anchor="middle">Task heads</text>

          <rect class="glow" data-glow="rec" filter="url(#glow-w)" x="1185" y="106" width="180" height="86" rx="6"/>
          <rect class="box" x="1185" y="106" width="180" height="86" rx="6"/>
          <rect class="hl" data-glow="rec" x="1185" y="106" width="180" height="86" rx="6"/>
          <text class="t-box" x="1275" y="130" text-anchor="middle">Reconstruction</text>
          <circle class="emb small" data-op="recA" cx="1226" cy="162" r="7"/>
          <circle class="emb small dashed" data-op="recB" cx="1226" cy="162" r="7"/>
          <text class="t-plus" x="1243" y="167" text-anchor="middle">+</text>
          <rect class="seq" x="1254" y="154" width="14" height="16"/><rect class="pos" x="1268" y="154" width="14" height="16"/>
          <rect class="outline" x="1254" y="154" width="28" height="16" rx="2"/>
          <line class="conn" x1="1286" y1="162" x2="1310" y2="162"/>
          <rect class="val" x="1316" y="148" width="16" height="28" rx="2"/>
          <rect class="fill-gene" data-sy="recon" x="1316" y="148" width="16" height="28" rx="2"/>
          <rect class="outline" x="1316" y="148" width="16" height="28" rx="2"/>

          <rect class="glow" data-glow="vis" filter="url(#glow-w)" x="1185" y="208" width="180" height="86" rx="6"/>
          <rect class="box" x="1185" y="208" width="180" height="86" rx="6"/>
          <rect class="hl" data-glow="vis" x="1185" y="208" width="180" height="86" rx="6"/>
          <text class="t-box" x="1275" y="232" text-anchor="middle">VISReg</text>
          <g data-tx="alignA">
            <circle class="emb" data-op="visA" cx="1233" cy="264" r="8"/>
            <g data-op="pair"><rect class="shaft" data-sx="half" data-origin="left" x="1245" y="263.25" width="30" height="1.5"/><path class="chev" d="M1250,259 L1244.5,264 L1250,269"/></g>
          </g>
          <g data-tx="alignB">
            <circle class="emb dashed" data-op="visB" cx="1317" cy="264" r="8"/>
            <g data-op="pair"><rect class="shaft" data-sx="half" data-origin="right" x="1275" y="263.25" width="30" height="1.5"/><path class="chev" d="M1300,259 L1305.5,264 L1300,269"/></g>
          </g>
          <g data-dots></g>
        </svg>

      </figure>

      <div class="stepper">
        <button type="button" class="icon-btn" data-act="back" aria-label="Previous step">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="icon-btn icon-btn-solid" data-act="next" aria-label="Next step">
          <svg class="ico-next" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          <svg class="ico-replay" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </button>
        <input type="range" class="scrub" min="0" max="1000" step="1" value="0" aria-label="Scrub through the animation">
        <span class="step-count">0/3</span>
      </div>
      <p class="step-text" aria-live="polite"></p>
    </div>
  </section>
</main>

<script src="assets/js/figure.js" defer></script>
</body>
</html>
